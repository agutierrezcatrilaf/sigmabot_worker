    padding: 8px 12px;

  .cols {

    overflow-x: auto;
    padding-bottom: 8px;

  .col {
    flex: 0 0 460px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    max-height: calc(100vh - 148px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .col .body { overflow: auto; }
  section.pending-card { margin-top: 16px; }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  section h2 {
    margin: 0;
    padding: 12px 14px;
    font-size: 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  section h2 span { color: var(--muted); font-weight: 500; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left;
    padding: 6px 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  th { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: #fafbfc; }
  tr:last-child td { border-bottom: 0; }
  td.n { width: 36px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pending { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px; }
  .pending i {
    font-style: normal;
    background: var(--chip);
    color: #345;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
  }
  .empty { padding: 16px; color: var(--muted); }

<script>
const data = JSON.parse(document.getElementById("data").textContent);
const campos = data.recibidos;
const q = document.getElementById("q");

function render() {
  const term = q.value.trim().toLocaleLowerCase("es");
  let visibles = 0;
  let total = 0;

  document.getElementById("cols").innerHTML = campos.map(campo => {
    const lista = data[campo];
    total += lista.length;
    const rows = lista
      .filter(v => !term || v.toLocaleLowerCase("es").includes(term))
      .slice()
      .sort((a, b) => a.localeCompare(b, "es", { numeric: true, sensitivity: "base" }));
    visibles += rows.length;
    const body = rows.map((v, n) =>
      `<tr><td class="n">${n + 1}</td><td>${escapeHtml(v)}</td></tr>`
    ).join("") || `<tr><td colspan="2" class="empty">Sin coincidencias.</td></tr>`;
    const count = term ? `${rows.length} de ${lista.length}` : `${lista.length} distintos`;
    return `<section class="col"><h2>${campo} <span>${count}</span></h2><div class="body"><table><thead><tr><th>#</th><th>Valor</th></tr></thead><tbody>${body}</tbody></table></div></section>`;
  }).join("");

  document.getElementById("stats").innerHTML =
    `Recibidos: <b>${campos.join(", ")}</b> · ${total} valores · mostrando <b>${visibles}</b>`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

document.getElementById("mencionados").innerHTML = (data.mencionados || []).map(m => `<i>${m.campo} · ${m.filas} filas</i>`).join("");
document.getElementById("pending").innerHTML = data.pendientes.map(p => `<i>${p}</i>`).join("");
q.addEventListener("input", render);
render();
</script>
